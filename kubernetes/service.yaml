apiVersion: v1
kind: Service
metadata:
  name: land-title-registry-service
  namespace: land-title-registry
  labels:
    app: land-title-registry
spec:
  type: ClusterIP
  selector:
    app: land-title-registry
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  - name: https
    port: 443
    targetPort: 8443
    protocol: TCP
  sessionAffinity: None
