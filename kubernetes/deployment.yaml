apiVersion: apps/v1
kind: Deployment
metadata:
  name: land-title-registry
  namespace: land-title-registry
  labels:
    app: land-title-registry
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: land-title-registry
  template:
    metadata:
      labels:
        app: land-title-registry
        version: v1
    spec:
      containers:
      - name: land-title-registry
        image: {{IMAGE_URI}}
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: https
          containerPort: 8443
          protocol: TCP
        env:
        # Application Configuration
        - name: JAVA_OPTS
          value: "-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
        - name: TZ
          value: "UTC"
        - name: PORT
          value: "8080"
        - name: APP_ENV
          value: "production"
        - name: LOG_LEVEL
          value: "INFO"
        
        # Database Configuration (External Service)
        # These values should be provided during deployment
        - name: DB_HOST
          value: "{{DB_HOST}}"
        - name: DB_PORT
          value: "{{DB_PORT}}"
        - name: DB_NAME
          value: "{{DB_NAME}}"
        - name: DB_USER
          value: "{{DB_USER}}"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: land-title-registry-secrets
              key: db-password
              optional: true
        
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        
        livenessProbe:
          httpGet:
            path: /ltr/health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 90
          periodSeconds: 30
          timeoutSeconds: 10
          successThreshold: 1
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /ltr/health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        
        volumeMounts:
        - name: config
          mountPath: /opt/ol/usr/servers/defaultServer/configDropins/overrides
          readOnly: true
        - name: logs
          mountPath: /opt/ol/usr/servers/defaultServer/logs
      
      volumes:
      - name: config
        configMap:
          name: land-title-registry-config
          optional: true
      - name: logs
        emptyDir: {}
      
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
