apiVersion: v1
kind: Service
metadata:
  name: ltr-web-service
  namespace: ltr-web
  labels:
    app: ltr-web
    component: web-application
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  - name: https
    port: 443
    targetPort: 8443
    protocol: TCP
  selector:
    app: ltr-web
  sessionAffinity: None
