# Spring Boot Application Configuration for AWS Cloud Deployment
# Land Title Registry - Web Module

# Application Name
spring.application.name=land-title-registry-web

# Server Configuration
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

# Session Management with Amazon ElastiCache (Redis)
# Replace stateful middleware clustering with distributed session management
spring.session.store-type=redis
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=${REDIS_SSL:false}
spring.redis.timeout=2000ms

# Session timeout (30 minutes)
server.servlet.session.timeout=30m
spring.session.redis.namespace=ltr:session

# Jackson JSON Configuration
# Use java.time API for date/time serialization (UTC standardization)
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSSZ

# Logging Configuration
logging.level.root=INFO
logging.level.com.trianz.ltr=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Actuator Endpoints (for cloud health monitoring)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.redis.enabled=true

# Security Configuration
# Note: Detailed security configuration should be in SecurityConfiguration.java
spring.security.user.name=${SECURITY_USER:admin}
spring.security.user.password=${SECURITY_PASSWORD:changeme}

# AWS Secrets Manager Integration (if using AWS SDK)
# Credentials should be externalized to AWS Secrets Manager
# aws.secretsmanager.enabled=true
# aws.region=${AWS_REGION:us-east-1}
