# Land Title Registry - Web Module Configuration
# Cloud-Native Spring Boot Application

# ============================================================================
# SERVER CONFIGURATION
# ============================================================================
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/ltr-web
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain

# ============================================================================
# SPRING SESSION - AMAZON ELASTICACHE (REDIS)
# ============================================================================
# Replaces WebSphere session replication with cloud-native Redis-backed sessions
spring.session.store-type=redis
spring.session.redis.namespace=ltr:session
spring.session.timeout=30m

# Redis connection (Amazon ElastiCache)
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=${REDIS_SSL:false}
spring.redis.timeout=2000ms
spring.redis.lettuce.pool.max-active=8
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=2

# ============================================================================
# LOGGING - CLOUD-NATIVE STRUCTURED LOGGING
# ============================================================================
logging.level.root=INFO
logging.level.com.trianz.ltr=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# ============================================================================
# SPRING BOOT ACTUATOR - HEALTH CHECKS FOR AWS
# ============================================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.health.redis.enabled=true
management.health.db.enabled=true

# ============================================================================
# JACKSON JSON SERIALIZATION
# ============================================================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=UTC

# ============================================================================
# AWS CLOUD CONFIGURATION
# ============================================================================
# AWS Region for Secrets Manager, CloudWatch, etc.
aws.region=${AWS_REGION:us-east-1}

# Database credentials from AWS Secrets Manager
db.secret.name=${DB_SECRET_NAME:ltr/database/credentials}

# ============================================================================
# SECURITY CONFIGURATION
# ============================================================================
# Spring Security will be configured via Java Config
# This replaces WebSphere JAAS authentication
