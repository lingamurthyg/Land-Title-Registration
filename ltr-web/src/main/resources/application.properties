# ============================================================================
# Land Title Registry - Cloud-Native Configuration for AWS
# ============================================================================
# This configuration file uses environment variables for cloud deployment.
# All sensitive data is externalized to AWS Secrets Manager.
#
# AWS Deployment:
# - ECS/EKS: Set environment variables in task definition
# - Elastic Beanstalk: Configure in environment properties
# - Lambda: Set in function configuration
#
# Required Environment Variables:
# - DB_HOST: AWS RDS endpoint
# - DB_PORT: Database port (default: 5432)
# - DB_NAME: Database name
# - DB_USERNAME: Database username (from Secrets Manager)
# - DB_PASSWORD: Database password (from Secrets Manager)
# - AWS_REGION: AWS region for services
# ============================================================================

# Application Configuration
spring.application.name=land-title-registry
server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# ============================================================================
# Database Configuration - AWS RDS PostgreSQL with HikariCP
# ============================================================================
# Replaces WAS JNDI DataSource with HikariCP connection pool
# Credentials loaded from AWS Secrets Manager (see DataSourceConfig)
# ============================================================================

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:landtitle}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Configuration
spring.datasource.hikari.pool-name=LandTitleHikariPool
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# ============================================================================
# Jackson JSON Configuration
# ============================================================================
# Replaces custom ObjectMapper configuration from servlet
# ============================================================================

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.indent-output=true
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.time-zone=UTC
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss'Z'

# ============================================================================
# Spring Boot Actuator - Health Checks for AWS
# ============================================================================
# Replaces custom HealthCheckServlet with Spring Boot Actuator
# Used by AWS ECS/EKS health probes and ALB target group health checks
# ============================================================================

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Health check configuration
management.health.db.enabled=true
management.health.diskspace.enabled=true
management.health.ping.enabled=true

# Metrics configuration for CloudWatch
management.metrics.export.cloudwatch.namespace=LandTitleRegistry
management.metrics.export.cloudwatch.batch-size=20
management.metrics.export.cloudwatch.step=1m
management.metrics.export.cloudwatch.enabled=${CLOUDWATCH_METRICS_ENABLED:true}

# ============================================================================
# Security Configuration
# ============================================================================
# Replaces WAS JAAS/LDAP with Spring Security
# For production, integrate with AWS Cognito or IAM
# ============================================================================

spring.security.user.name=${ADMIN_USERNAME:admin}
spring.security.user.password=${ADMIN_PASSWORD:admin}
spring.security.user.roles=REGISTRY_ADMIN

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# ============================================================================
# Logging Configuration - Structured JSON for CloudWatch
# ============================================================================
# Replaces java.util.logging with SLF4J/Logback
# JSON format for CloudWatch Logs Insights
# ============================================================================

logging.level.root=INFO
logging.level.com.trianz.ltr=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Console logging for cloud environments (no file logging)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# ============================================================================
# AWS Configuration
# ============================================================================

aws.region=${AWS_REGION:us-east-1}
aws.secretsmanager.enabled=${AWS_SECRETS_ENABLED:false}
aws.secretsmanager.secret-name=${DB_SECRET_ARN:}

# ============================================================================
# Async Configuration
# ============================================================================
# For non-blocking operations and improved throughput
# ============================================================================

spring.task.execution.pool.core-size=10
spring.task.execution.pool.max-size=50
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=ltr-async-

# ============================================================================
# Timezone Configuration
# ============================================================================
# Force UTC for all date/time operations
# ============================================================================

spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=UTC
