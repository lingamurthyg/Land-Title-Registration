# AWS Cloud Environment Configuration
# This file contains AWS-specific settings for production deployment

# AWS Region Configuration
aws.region=us-east-1

# AWS Secrets Manager Configuration
aws.secrets.database-credentials=ltr/database/credentials
aws.secrets.enabled=true

# Amazon RDS Configuration
db.jdbc.url=jdbc:postgresql://${RDS_ENDPOINT:localhost:5432}/landtitle
db.username=${DB_USERNAME:postgres}
db.password=${DB_PASSWORD:changeme}

# Amazon ElastiCache (Redis) Configuration
redis.host=${ELASTICACHE_ENDPOINT:localhost}
redis.port=${ELASTICACHE_PORT:6379}
redis.ssl=true
redis.cluster.enabled=false

# AWS CloudWatch Logging
logging.cloudwatch.enabled=true
logging.cloudwatch.log-group=/aws/ecs/landtitle-registry
logging.cloudwatch.log-stream=${HOSTNAME:localhost}

# AWS Application Load Balancer Health Check
management.server.port=8080
management.endpoints.web.base-path=/actuator
management.endpoint.health.probes.enabled=true

# Spring Boot Actuator for ECS/ALB Health Checks
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# Server Configuration for AWS
server.port=8080
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Timezone Configuration (UTC for cloud deployments)
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
user.timezone=UTC
