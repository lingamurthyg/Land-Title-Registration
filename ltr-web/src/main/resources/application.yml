# Spring Boot Application Configuration for AWS Cloud Deployment
# Land Title Registry System - Cloud-Native Configuration

spring:
  application:
    name: land-title-registry
  
  # DataSource Configuration - AWS RDS/Aurora with HikariCP
  datasource:
    # Database credentials retrieved from AWS Secrets Manager at runtime
    # See WASTransactionUtil.getDatabaseCredentials()
    url: ${DB_JDBC_URL:jdbc:postgresql://localhost:5432/landtitle}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
    
    # HikariCP Connection Pool Configuration
    hikari:
      pool-name: LandTitleRegistryPool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
      
      # AWS RDS optimizations
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
  
  # JPA Configuration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  
  # Redis Session Management - Amazon ElastiCache
  session:
    store-type: redis
    redis:
      flush-mode: on_save
      namespace: spring:session:landtitle
  
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    ssl: ${REDIS_SSL:false}
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 2
        max-wait: -1ms
  
  # Security Configuration
  security:
    user:
      name: ${ADMIN_USERNAME:admin}
      password: ${ADMIN_PASSWORD:changeme}
      roles: REGISTRY_ADMIN

# Server Configuration
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
    session:
      timeout: 30m
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
  
  # Tomcat Configuration
  tomcat:
    threads:
      max: 200
      min-spare: 10
    max-connections: 10000
    accept-count: 100

# Actuator Configuration for AWS Health Checks
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    redis:
      enabled: true
    db:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

# AWS Configuration
aws:
  region: ${AWS_REGION:us-east-1}
  secrets:
    database-credentials: ${DB_SECRET_NAME:ltr/database/credentials}

# Logging Configuration - Cloud-Native Structured Logging
logging:
  level:
    root: INFO
    com.trianz.ltr: INFO
    org.springframework: WARN
    org.hibernate: WARN
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: ${LOG_FILE:/var/log/landtitle/application.log}
    max-size: 10MB
    max-history: 30

# Application-Specific Configuration
landtitle:
  registry:
    region-code: ${REGISTRY_REGION:REG}
    timezone: UTC
