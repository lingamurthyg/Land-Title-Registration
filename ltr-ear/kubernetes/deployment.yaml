apiVersion: apps/v1
kind: Deployment
metadata:
  name: ltr-ear
  namespace: ltr-ear
  labels:
    app: ltr-ear
    version: "1.0.0"
    component: application
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ltr-ear
  template:
    metadata:
      labels:
        app: ltr-ear
        version: "1.0.0"
    spec:
      containers:
      - name: ltr-ear
        image: {{IMAGE_URI}}
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        # Java Runtime Configuration
        - name: JAVA_OPTS
          value: "-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
        - name: TZ
          value: "UTC"
        - name: PORT
          value: "8080"
        
        # Database Configuration (external service)
        - name: DB_HOST
          value: "{{DB_HOST}}"
        - name: DB_PORT
          value: "{{DB_PORT}}"
        - name: DB_NAME
          value: "{{DB_NAME}}"
        - name: DB_USER
          value: "{{DB_USER}}"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ltr-db-secret
              key: password
              optional: true
        - name: JDBC_URL
          value: "jdbc:postgresql://{{DB_HOST}}:{{DB_PORT}}/{{DB_NAME}}"
        
        # JNDI DataSource Configuration
        - name: JNDI_DATASOURCE
          value: "jdbc/LandTitleDS"
        
        # Application Configuration
        - name: APP_CONTEXT_ROOT
          value: "/ltr"
        - name: SESSION_TIMEOUT
          value: "30"
        
        # Security Configuration (LDAP/JAAS - external service)
        - name: LDAP_HOST
          value: "{{LDAP_HOST}}"
        - name: LDAP_PORT
          value: "{{LDAP_PORT}}"
        - name: LDAP_BASE_DN
          value: "{{LDAP_BASE_DN}}"
        
        # Logging Configuration
        - name: LOG_LEVEL
          value: "INFO"
        - name: LOG_FORMAT
          value: "json"
        
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 90
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
