version: '3.8'

services:
  ltr-ear:
    build:
      context: ..
      dockerfile: ltr-ear/Dockerfile
    image: land-title-registry:latest
    container_name: ltr-ear-app
    ports:
      - "8080:8080"
    environment:
      # Java Runtime Configuration
      - JAVA_OPTS=-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
      - TZ=UTC
      - PORT=8080
      
      # Database Configuration (external service)
      - DB_HOST=${DB_HOST:-database.example.com}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-landtitledb}
      - DB_USER=${DB_USER:-ltruser}
      - DB_PASSWORD=${DB_PASSWORD:-changeme}
      - JDBC_URL=jdbc:postgresql://${DB_HOST:-database.example.com}:${DB_PORT:-5432}/${DB_NAME:-landtitledb}
      
      # JNDI DataSource Configuration
      - JNDI_DATASOURCE=jdbc/LandTitleDS
      
      # Application Configuration
      - APP_CONTEXT_ROOT=/ltr
      - SESSION_TIMEOUT=30
      
      # Security Configuration (LDAP/JAAS - external service)
      - LDAP_HOST=${LDAP_HOST:-ldap.example.com}
      - LDAP_PORT=${LDAP_PORT:-389}
      - LDAP_BASE_DN=${LDAP_BASE_DN:-dc=example,dc=com}
      
      # Logging Configuration
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=json
    
    volumes:
      # Configuration files (if needed)
      - ./config:/opt/ltr/config:ro
      
      # Application logs
      - ltr-logs:/opt/ltr/logs
    
    networks:
      - ltr-network
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  ltr-network:
    driver: bridge

volumes:
  ltr-logs:
    driver: local
