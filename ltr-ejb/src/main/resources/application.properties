# Spring Boot Application Configuration for AWS Cloud Deployment
# Land Title Registry Service

# ============================================================================
# SERVER CONFIGURATION
# ============================================================================
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/ltr
spring.application.name=land-title-registry

# ============================================================================
# DATABASE CONFIGURATION (AWS RDS PostgreSQL)
# ============================================================================
# Credentials are retrieved from AWS Secrets Manager via DataSourceUtil
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:landtitle}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Configuration (optimized for AWS RDS)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.pool-name=LandTitleRegistryPool

# ============================================================================
# JPA / HIBERNATE CONFIGURATION
# ============================================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ============================================================================
# REDIS SESSION CONFIGURATION (AWS ElastiCache)
# ============================================================================
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.timeout=2000ms
spring.redis.lettuce.pool.max-active=8
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=2
spring.session.store-type=redis
spring.session.redis.namespace=ltr:session

# ============================================================================
# AWS CONFIGURATION
# ============================================================================
aws.region=${AWS_REGION:us-east-1}
aws.secretsmanager.secret-name=${DB_SECRET_NAME:ltr/db/credentials}

# ============================================================================
# SECURITY CONFIGURATION
# ============================================================================
spring.security.user.name=${ADMIN_USERNAME:admin}
spring.security.user.password=${ADMIN_PASSWORD:changeme}
spring.security.user.roles=REGISTRY_ADMIN

# ============================================================================
# LOGGING CONFIGURATION (CloudWatch compatible)
# ============================================================================
logging.level.root=INFO
logging.level.com.trianz.ltr=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# JSON logging for CloudWatch (uncomment for production)
# logging.pattern.console={"timestamp":"%d{yyyy-MM-dd'T'HH:mm:ss.SSSZ}","level":"%level","thread":"%thread","logger":"%logger","message":"%message"}%n

# ============================================================================
# ACTUATOR CONFIGURATION (Health checks for ECS/EKS)
# ============================================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.redis.enabled=true
management.health.db.enabled=true

# ============================================================================
# TRANSACTION CONFIGURATION
# ============================================================================
spring.transaction.default-timeout=30
spring.transaction.rollback-on-commit-failure=true

# ============================================================================
# TIMEZONE CONFIGURATION (UTC for cloud consistency)
# ============================================================================
spring.jackson.time-zone=UTC
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSSZ
