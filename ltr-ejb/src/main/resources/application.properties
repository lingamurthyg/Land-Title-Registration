# Land Title Registry - Cloud-Native Configuration
# All sensitive values should be provided via environment variables or AWS Secrets Manager

# Application
spring.application.name=land-title-registry
server.port=${PORT:8080}

# Database Configuration (AWS RDS)
# These are read by CloudDataSourceUtil from environment variables
# DB_HOST, DB_PORT, DB_NAME, DB_SECRET_NAME, AWS_REGION

# Connection Pool (HikariCP)
# DB_POOL_MAX_SIZE=20
# DB_POOL_MIN_IDLE=5
# DB_CONNECTION_TIMEOUT_MS=30000
# DB_IDLE_TIMEOUT_MS=600000
# DB_MAX_LIFETIME_MS=1800000

# Logging Configuration (Cloud-native structured logging)
logging.level.root=INFO
logging.level.com.trianz.ltr=DEBUG
logging.level.org.springframework=INFO
logging.level.com.zaxxer.hikari=INFO

# Logging pattern for CloudWatch
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# JSON logging for cloud environments (uncomment for production)
# logging.config=classpath:logback-spring.xml

# Transaction Management
spring.transaction.default-timeout=30

# Security
spring.security.user.name=${SECURITY_USER:admin}
spring.security.user.password=${SECURITY_PASSWORD:admin}

# Actuator (Health checks for AWS ECS/EKS)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.db.enabled=true

# Metrics (AWS CloudWatch)
management.metrics.export.cloudwatch.namespace=LandTitleRegistry
management.metrics.export.cloudwatch.enabled=${CLOUDWATCH_METRICS_ENABLED:false}

# Jackson (JSON serialization)
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

# AWS Configuration
cloud.aws.region.static=${AWS_REGION:us-east-1}
cloud.aws.region.auto=false
cloud.aws.stack.auto=false

# Graceful shutdown for cloud deployments
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
